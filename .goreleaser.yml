version: 2
project_name: momo

builds:
  - id: momo
    main: ./cmd
    binary: momo
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X momo/internal/version.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - scripts/install.sh
      - scripts/install.ps1

snapshot:
  name_template: "{{ .Tag }}-SNAPSHOT"

release:
  github:
    owner: Bhagattji
    name: momo
  prerelease: auto
  footer: |
    ## Install

    ### Windows (PowerShell)
    ```powershell
    irm https://raw.githubusercontent.com/Bhagattji/momo/main/scripts/install.ps1 | iex
    ```

    ### Linux / macOS
    ```bash
    curl -fsSL https://raw.githubusercontent.com/Bhagattji/momo/main/scripts/install.sh | bash
    ```

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999