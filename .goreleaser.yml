project_name: momo

builds:
  - id: momo
    main: ./cmd
    binary: momo
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X 'momo/internal/version.Version={{.Version}}'
    mod_timestamp: '2023-01-01T00:00:00Z'

archives:
  - format: tar.gz
    name_template: '{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}'
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: '{{.Tag}}-SNAPSHOT'

release:
  github:
    owner: Bhagattji
    name: momo
  draft: false
  prerelease: false

signs:
  - artifacts: checksums
    args:
      - --batch
      - --yes
      - --armor
      - --detach-sign
      - --default-key
      - "{{.Env.GPG_FINGERPRINT}}"
    env:
      - GPG_FINGERPRINT

sbom:
  artifacts: archives

changelog:
  use: git
  groups:
    - title: Features
      regexp: '^feat:'
    - title: Bug Fixes
      regexp: '^fix:'
    - title: Chores
      regexp: '^chore:'

nfpms:
  - id: momo-deb
    file_name_template: '{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}'
    package_name: momo
    maintainer: Momo Maintainers <dev@example.com>
    description: Momo CLI
    vendor: Momo
    homepage: https://github.com/Bhagattji/momo
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    scripts:
      postinstall: |
        echo "momo installed successfully"
