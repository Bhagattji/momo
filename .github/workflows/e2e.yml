name: E2E and smoke tests

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      - name: Install deps
        run: go mod download
      - name: Run e2e if PROVIDER_API_KEY set
        if: env.PROVIDER_API_KEY != '' || secrets.PROVIDER_API_KEY != ''
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
        run: |
          go test ./internal/e2e -v
      - name: Skip E2E
        if: env.PROVIDER_API_KEY == '' && secrets.PROVIDER_API_KEY == ''
        run: echo "Skipping E2E — PROVIDER_API_KEY not set"
